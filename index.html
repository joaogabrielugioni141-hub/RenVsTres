<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ren vs Zai :3</title>
<style>
  body {
    background-color: #000;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
  }
  .container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
  }
  .players {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
  }
  .player {
    margin: 0 50px;
  }
  .player img {
    width: 150px;
    height: 150px;
    border-radius: 10px;
  }
  .score {
    font-size: 80px;
    font-weight: bold;
  }
  .ties {
    font-size: 20px;
    margin-bottom: 30px;
  }
  .details-button {
    background-color: #222; /* Cor escura */
    color: white;
    border: 1px solid #555;
    padding: 12px 25px;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .details-button:hover {
    background-color: #333; /* Um tom mais claro ao passar o mouse */
    border-color: #888;
  }
</style>
</head>
<body>

<div class="container">
  <div class="players">
    <div class="player">
      <img src="avatar1.png" alt="Player 1">
      <h2>ren</h2>
    </div>

    <div>
      <div class="score" id="score">0 - 0</div>
      <div class="ties" id="ties">Empates: 0</div>
    </div>

    <div class="player">
      <img src="avatar2.png" alt="Player 2">
      <h2>zai</h2>
    </div>
  </div>

  <!-- Botão de detalhes -->
  <button class="details-button" onclick="window.open('https://docs.google.com/spreadsheets/d/1DjgKPxUqKNn9ok141uoMwLbyNuJ8wpdJkofmVRhPWmA/edit?usp=sharing', '_blank')">
    Detalhes
  </button>
</div>

<script>
const SHEET_ID = "1DjgKPxUqKNn9ok141uoMwLbyNuJ8wpdJkofmVRhPWmA";
const RANGE = "P:P"; // Coluna P
const API_KEY = "AIzaSyAIUhWzBSEcnrj-FqLwEsFRQPECE3EEUaY";

async function fetchData() {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;
  
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("Erro na requisição à API");
    
    const data = await res.json();
    const values = data.values ? data.values.flat().map(v => v.toLowerCase().trim()) : [];
    
    let ren = 0, tres = 0, tie = 0;
    values.forEach(v => {
      if (v === "ren") ren++;
      else if (v === "zai") zai++;
      else if (v === "tie") tie++;
    });

    document.getElementById("score").textContent = `${ren} - ${zai}`;
    document.getElementById("ties").textContent = `Empates: ${tie}`;
  } catch (err) {
    console.error("Erro ao buscar dados:", err);
  }
}

// Atualiza ao carregar e a cada 10s
fetchData();
setInterval(fetchData, 10000);
</script>

</body>
</html>
